<div class="card">
  <h2 class="card-header">SVG offline exportieren</h2>
  <div class="card-body d-flex flex-column gap-2">
    <a href="{% url 'plugins:netbox_utilities:rack_elevation_offline_svg' pk=rack.pk %}?face=front"
       class="btn btn-outline-secondary netbox-utilities-offline-svg-link" data-face="front"
       title="Vorderseite als linkfreie SVG-Datei herunterladen">
      <i class="mdi mdi-download" aria-hidden="true"></i>
      Vorderseite
    </a>
    <a href="{% url 'plugins:netbox_utilities:rack_elevation_offline_svg' pk=rack.pk %}?face=rear"
       class="btn btn-outline-secondary netbox-utilities-offline-svg-link" data-face="rear"
       title="Rückseite als linkfreie SVG-Datei herunterladen">
      <i class="mdi mdi-download" aria-hidden="true"></i>
      Rückseite
    </a>
  </div>
</div>
<script>
(function () {
  var links = document.querySelectorAll(".netbox-utilities-offline-svg-link");
  var viewSelect = document.querySelector("select.rack-view");
  if (!links.length || !viewSelect) {
    return;
  }

  function syncLinks() {
    links.forEach(function (link) {
      var url = new URL(link.href, window.location.origin);
      url.searchParams.set("view", viewSelect.value);
      link.href = url.toString();
    });
  }

  viewSelect.addEventListener("change", syncLinks);
  syncLinks();
})();
</script>
