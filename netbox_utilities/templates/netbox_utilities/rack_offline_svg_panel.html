<script>
(function () {
  var offlineBaseUrl = "{% url 'plugins:netbox_utilities:rack_elevation_offline_svg' pk=rack.pk %}";
  var viewSelect = document.querySelector("select.rack-view");

  function currentView() {
    return viewSelect ? viewSelect.value : "images-and-labels";
  }

  function buildHref(face) {
    var url = new URL(offlineBaseUrl, window.location.origin);
    url.searchParams.set("face", face);
    url.searchParams.set("view", currentView());
    return url.toString();
  }

  function insertOfflineButtons() {
    document.querySelectorAll('a[href*="render=svg"]').forEach(function (nativeLink) {
      if (nativeLink.dataset.netboxUtilitiesOfflineInserted) {
        return;
      }
      nativeLink.dataset.netboxUtilitiesOfflineInserted = "true";

      var nativeUrl = new URL(nativeLink.href, window.location.origin);
      var face = nativeUrl.searchParams.get("face") || "front";

      var offlineLink = document.createElement("a");
      offlineLink.className = nativeLink.className + " netbox-utilities-offline-svg-link";
      offlineLink.title = "Wie \"SVG herunterladen\", aber ohne interne Links – funktioniert offline";
      offlineLink.href = buildHref(face);
      offlineLink.innerHTML = '<i class="mdi mdi-download" aria-hidden="true"></i> SVG offline';

      nativeLink.insertAdjacentElement("afterend", offlineLink);
    });
  }

  insertOfflineButtons();

  if (viewSelect) {
    viewSelect.addEventListener("change", function () {
      document.querySelectorAll(".netbox-utilities-offline-svg-link").forEach(function (link) {
        var url = new URL(link.href, window.location.origin);
        url.searchParams.set("view", currentView());
        link.href = url.toString();
      });
    });
  }
})();
</script>
