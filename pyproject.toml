[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netbox-utilities"
version = "0.25.0"
description = "Navigation, tenant utilities, connection VLANs, partial-width racks, disks, CPU & RAM, switch port export and bulk operations for NetBox 4.6/4.7"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "reportlab>=4.0",
]
license = { text = "MIT" }
authors = [
  { name = "MrBlake" }
]
classifiers = [
  "Framework :: Django",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://git.mrblake.cc/MrBlake/Netbox-Utilities"

[tool.hatch.build.targets.wheel]
packages = ["netbox_utilities"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = ["RUF012"]
